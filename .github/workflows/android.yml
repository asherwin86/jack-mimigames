# Builds the Android app (an APK that runs the whole arcade offline, bundled inside it) and attaches it to the
# GitHub Release for the tag:   git tag v1.0.30 && git push origin v1.0.30
# It can also be run by hand from the Actions tab (workflow_dispatch) to get the APK as a downloadable artifact.
# Signing key: repository secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS.
name: Build Android app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the web app and copy it into the Android project
        run: |
          npm run build
          npx cap sync android
      - name: Version (from the tag when there is one)
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "APP_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
            echo "APP_VERSION_CODE=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION_NAME=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mimigames.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mimigames.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          else
            echo "No signing key set: the APK will be signed with a throwaway debug key."
          fi
      - name: Build the APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/*.apk 100-Mimi-Games.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 100-Mimi-Games-apk
          path: 100-Mimi-Games.apk
      # The Windows workflow creates the release; wait for it (or make it) and add the APK to it.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" 100-Mimi-Games.apk --clobber
